name: integration-tests

on:
  push:
    branches:
      - main
      - release/**
  pull_request:

jobs:
  integration-test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is pinned because the Xcode version selected below only exists
          # on the macos-15 image; macos-latest now points at macOS 26.
          - host: macos-15
            target: macos
          - host: macos-15
            target: macos-framework
          - host: macos-15
            target: ios
          - host: macos-15
            target: ios-framework
          - host: macos-15
            target: ipa
          - host: ubuntu-latest
            target: linux
          - host: ubuntu-latest
            target: web
          - host: ubuntu-latest
            target: apk
          - host: ubuntu-latest
            target: appbundle
          - host: windows-latest
            target: windows
    env:
      TEST_PLATFORM: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff #2.18.0

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
        if: runner.os == 'Linux'

      - run: (flutter --version)[0] | Out-File flutter.version
        shell: pwsh

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: temp/testapp-${{ matrix.target }}
          key: integration-test-${{ matrix.host }}-${{ matrix.target }}-${{ hashFiles('flutter.version') }}

      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
        if: ${{ matrix.target == 'ios' || matrix.target == 'ios-framework' || matrix.target == 'ipa' }}

      - run: dart test --tags integration

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: ${{ matrix.target }}-build
          path: temp/testapp-${{ matrix.target }}/build
